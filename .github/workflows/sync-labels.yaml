name: '🏷️ Sync labels'

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions: {}

jobs:
  call:
    # label-sync is handed GITHUB_TOKEN below and writes the repository's label set
    # through the issues API, so that one write is what the job gets and nothing
    # else. Its config file is fetched over plain https and needs no token.
    permissions:
      issues: write
    # Pinned so what runs here cannot change in another repository without a change
    # in this one. Renovate reads the `@<sha> # <ref>` shape and is what moves it.
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/sync-labels.yaml@eb99033a7ff644881b014bc0b4169916c854a68b # master as of 2026-07-29
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
