# Allows for the definition of PR and Issue /commands
name: "📟 Slash Command Dispatcher"

on:
  issue_comment:
    types:
      - created

# Nothing in the called workflow touches GITHUB_TOKEN: slash-command-dispatch does
# every API call, including the reaction, with the `token` secret passed below.
permissions: {}

jobs:
  call:
    # Pinned so what runs here cannot change in another repository without a change
    # in this one. Renovate reads the `@<sha> # <ref>` shape and is what moves it.
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/command-dispatch.yaml@eb99033a7ff644881b014bc0b4169916c854a68b # master as of 2026-07-29
    secrets:
      token: .
