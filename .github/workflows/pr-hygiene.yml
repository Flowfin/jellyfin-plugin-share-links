# Deterministic PR-hygiene checks (#15). Mechanical properties of a pull request
# that a person should never have to look for: whether it is linked to an issue,
# how large it is, and whether code moved without a test moving with it. Every
# other check here reasons about the code; this one reasons about the pull
# request, which is a class none of them cover.
#
# Ported from the target gate's pr-hygiene.yml. Read that file rather than this
# comment if you want the original:
#
#   gh api repos/iderex/jellyfin-plugin-sso/contents/.github/workflows/pr-hygiene.yml --jq '.content' | base64 -d
#
# The tiers are kept because they are the point. A FAIL check has to be one a
# contributor can satisfy and one that is near enough certain when it fires; a
# convention that a reasonable pull request can break belongs in WARN, where it
# annotates and never reds.
#
#   FAIL, and it holds the merge:
#     * the pull request body carries an issue reference
#     * no closing keyword in the body, and none in a commit message of the
#       range, stands behind a negation (#308)
#   WARN, annotation only:
#     * the diff is large, 400 changed lines or more, generated files excluded
#     * plugin code changed with no matching change under the test project
#     * `version` is raised in build.yaml and no fragment under changelog.d
#       moves with it (#326)
#
# THE FAIL TIER APPLIES TO EVERY AUTHOR, AND THIS PARAGRAPH SAID IT WAS SKIPPED
# FOR AUTHORS FROM OUTSIDE THIS REPOSITORY. What stood here argued that a person
# from outside has no way to know which issue number this board expects before
# they have filed anything, and often no issue exists yet, so failing their
# contribution on it is a ritual rather than a caught slip.
#
# That argument did not survive the population it met. The skip keyed on
# `author_association` as the event payload reports it, and on this board the
# payload answers COLLABORATOR - outside the set the skip called inside - for the
# account that opens every pull request here, while the same field read through
# the pulls API answers MEMBER. So the tier that can red this check was skipped on
# all four of the most recent pull requests, in a context the ruleset requires,
# and a required context that cannot fail on the pull requests a board actually
# receives refuses nothing. Decided on smart-collections#246 on 2026-09-04, for
# every copy of this workflow, and taken here as #355.
#
# THE GUIDANCE THE SKIP CARRIED IS NOT LOST. It moved into the failure message,
# where an author reads it at the moment it applies rather than as an annotation
# on a green run: file the issue where none exists yet, and reference that.
#
# THE BOT SKIP STAYS, and it is the one reason that never turned on who is inside:
# a bot cannot know the convention. It now says so on the pull request instead of
# skipping in silence, so a run that judged nothing does not read like one that
# judged and found nothing.
#
# THE CLOSING-KEYWORD CHECK IS SKIPPED FOR NOBODY, bots included, and that is not
# an oversight in the paragraphs above. The bot reason does not carry over: the
# shape needs no convention to be known, and satisfying it costs one rewording of
# a sentence the author has already written. What it prevents is a tracker action
# taken against what the text says, and the tracker takes that action whoever
# wrote the text.
#
# ONE check in the original is deliberately NOT here, and it is not an oversight.
# THIS PARAGRAPH SAID THERE WERE TWO, and the second of them has arrived, at the
# warning tier, five lines further down this file.
#
# The original also requires every commit subject to carry a bracketed issue
# reference, `[#N]`. This repository has never used that convention: no commit on
# the default branch carries it, so porting it as a FAIL check would red every
# pull request from the first one onward, including the work that is already
# merged. Importing a commit-message convention is a decision about how this
# board writes commits, not a hygiene check, and it is not made here.
#
# THE VERSION-AND-CHANGELOG CHECK IS BACK, IN THIS BOARD'S OWN SHAPE. The
# original requires a `version:` bump in build.yaml to touch CHANGELOG.md. There
# is no CHANGELOG.md here and #89 decided there will not be one: the notes an
# operator reads are assembled from `changelog.d` into the release for the tag,
# so the check could never come back in the shape it was left in, and the
# condition written beside it - that it returns when the changelog does - had
# been met by a file that sentence would have waited past forever.
#
# What it judges here is what `docs/RELEASING.md` already asks for: the change
# that raises `version` in build.yaml deletes the fragments that went into that
# version. #326 decided the tier, and it is WARN because the population is empty
# - no version has been raised on this board since the first, so its first firing
# would otherwise be on the first release, which is the worst moment to find out
# that a new gate has an edge nobody anticipated. What promotes it to FAIL is
# written in the check's own header rather than here, so that the promise is read
# by whoever next opens the check.
name: PR Hygiene

on:
  pull_request:
    # edited: so adding the issue reference to the body re-runs the check rather
    # than leaving a red one that is no longer true.
    types: [opened, edited, synchronize, reopened]

# Explicit deny-all at workflow level; the job below grants only what it reads.
permissions: {}

# Cancel a superseded run on the same pull request. This is a lint, not a
# publish, so cancelling an obsolete run is safe.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Deterministic PR-hygiene checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # the checkout, for the refusal script and its fixtures
      pull-requests: read # the body, the author association, the changed-file list

    steps:
      # THIS JOB CARRIED NO CHECKOUT UNTIL #308, and the sentence that stood here
      # stated that as a property of the job. The closing-keyword refusal is a
      # script in this repository and its proof reads fixtures beside it, so the
      # tree has to be here. What has not changed is where the pull request's own
      # text comes from: every input below is read from the metadata through the
      # API, and untrusted values - the body, the commit messages, the file names
      # - are only ever read from the JS objects or written out with `fs`, never
      # interpolated into a shell `run:`. There is no template-injection surface
      # here either way.
      #
      # The whole history, because one leg of the proof compares a fixture
      # against the message of the commit it was taken from. On a shallow clone
      # that leg fails and says why, rather than passing quietly.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # No step pushes via git, so do not persist the GITHUB_TOKEN in .git/config.
          persist-credentials: false

      - name: Write out the text this pull request proposes
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require("fs");
            const path = require("path");

            const dir = path.join(process.env.RUNNER_TEMP, "pull-request-text");
            fs.mkdirSync(dir, { recursive: true });

            const pr = context.payload.pull_request;
            fs.writeFileSync(path.join(dir, "pull-request-body.md"), pr.body || "");

            // The commit messages of the range, and not only the body. The third
            // instance of the shape refused below carried it in a landed message,
            // which is the copy that cannot be taken back: a message on the
            // default branch is read for closing keywords the same way a body is,
            // and repairing one means rewriting history.
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });
            for (const c of commits) {
              fs.writeFileSync(path.join(dir, `commit-${c.sha}.msg`), c.commit.message);
            }

            core.info(
              `Wrote the body and ${commits.length} commit message(s) to ${dir}. ` +
                "The refusal below names one of those files, so a hit in " +
                "pull-request-body.md is in the body and a hit in commit-<sha>.msg " +
                "is in that commit's message.",
            );

      - name: Write out the change this pull request proposes
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require("fs");
            const path = require("path");

            const dir = path.join(process.env.RUNNER_TEMP, "pull-request-change");
            fs.mkdirSync(dir, { recursive: true });

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });

            fs.writeFileSync(
              path.join(dir, "changed-files.txt"),
              files.map((f) => f.filename).join("\n") + "\n",
            );

            // The diff of one file, and only because the check has to tell a
            // raised `version` from a build.yaml touched for something else.
            // The forge omits `patch` for a file it considers too large or not
            // text, and a missing diff is NOT the convention being satisfied -
            // so that case is written out as its own marker and the check says
            // it could not judge rather than reading clean.
            const buildYaml = files.find((f) => f.filename === "build.yaml");
            if (buildYaml) {
              if (typeof buildYaml.patch === "string") {
                fs.writeFileSync(path.join(dir, "build.yaml.patch"), buildYaml.patch);
              } else {
                fs.writeFileSync(path.join(dir, "build.yaml.patch-missing"), "");
              }
            }

            core.info(
              `Wrote ${files.length} changed path(s) to ${dir}` +
                (buildYaml ? ", with the diff of build.yaml beside them." : "."),
            );

      - name: Run PR-hygiene checks
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = context.payload.pull_request;
            const warnings = [];
            const failures = [];

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const changed = files.map((f) => f.filename);
            const isBot = pr.user && pr.user.type === "Bot";

            // The author's relationship to this repository decides nothing here.
            // What stood in its place read `author_association` out of the event
            // payload and skipped the FAIL tier for anybody outside
            // ["OWNER", "MEMBER"]; the head of this file carries what that cost
            // and where it was decided (#355). The association is still REPORTED,
            // because the run that reports it is how the skip was found, and a
            // reader who wants to know what the payload said should not have to
            // re-derive it from a merged pull request.
            const failTierApplies = !isBot;
            core.info(
              "The FAIL tier applies to every author. This one reports " +
                `author_association: ${pr.author_association || "NONE"}, which ` +
                `changes nothing. Bot: ${isBot ? "yes" : "no"}.`,
            );
            if (isBot) {
              warnings.push(
                "The author is a bot, so the FAIL-tier checks are skipped: a bot " +
                  "cannot know this board's issue-reference convention. The linkage " +
                  "is still wanted, and whoever picks this up supplies it.",
              );
            }

            // FAIL: the pull request says which issue it is for. A bare `#123`, a
            // keyword form, or a full issue URL all satisfy it. Lenient on
            // purpose, so a genuinely linked pull request is never failed on
            // phrasing.
            const body = pr.body || "";
            const hasIssueRef =
              /(^|[^\w])#\d+\b/.test(body) ||
              /github\.com\/[^\/\s]+\/[^\/\s]+\/issues\/\d+/i.test(body);
            if (failTierApplies && !hasIssueRef) {
              failures.push(
                "The pull request body has no issue reference. Link the issue it " +
                  "addresses, for example `Closes #123` or `Refs #123`. Where no " +
                  "issue exists for this yet, file one and reference that: the " +
                  "linkage is what a later reader follows back to why the change " +
                  "was made.",
              );
            }

            // WARN: size. Large is not wrong. A feature, a document, or a rename
            // legitimately exceeds any cap, so this annotates and never reds.
            const isGenerated = (name) =>
              name.endsWith("packages.lock.json") ||
              name.endsWith(".min.js") ||
              name.endsWith(".min.css");
            const churn = files
              .filter((f) => !isGenerated(f.filename))
              .reduce((sum, f) => sum + f.additions + f.deletions, 0);
            const WARN_AT = 400;
            if (churn >= WARN_AT) {
              warnings.push(
                `This pull request changes ${churn} lines, generated files excluded. ` +
                  `Reviews degrade past about ${WARN_AT} lines, so this one wants a ` +
                  "closer look, or splitting.",
              );
            }

            // WARN: code without a test. A comment-only edit, a pure refactor or a
            // project-file tweak legitimately touches no test, and failing those
            // would be exactly the false positive the tiers exist to avoid.
            const codeChanged = changed.some(
              (n) => n.startsWith("Jellyfin.Plugin.ShareLinks/") && n.endsWith(".cs"),
            );
            const testsChanged = changed.some((n) =>
              n.startsWith("Jellyfin.Plugin.ShareLinks.Tests/"),
            );
            if (codeChanged && !testsChanged) {
              warnings.push(
                "Jellyfin.Plugin.ShareLinks/*.cs changed with no change under " +
                  "Jellyfin.Plugin.ShareLinks.Tests/. Add a test, or confirm the change " +
                  "is genuinely untestable.",
              );
            }

            for (const w of warnings) core.warning(w);
            const summary = core.summary.addHeading("PR-hygiene checks", 2);
            if (failures.length === 0 && warnings.length === 0) {
              summary.addRaw("All deterministic PR-hygiene checks passed.");
            } else {
              if (failures.length) {
                summary.addHeading("Failures", 3).addList(failures);
              }
              if (warnings.length) {
                summary.addHeading("Warnings, non-blocking", 3).addList(warnings);
              }
            }
            await summary.write();

            if (failures.length) {
              core.setFailed(failures.join(" | "));
            }

      # After the step above rather than before it, so a body that is both
      # unlinked and carrying this shape is told about both in one run. `run:`
      # steps do not execute once an earlier step has failed, and the checks in
      # this job are independent of one another, so each of the two below says so
      # for itself.
      - name: Refuse a closing keyword a negation stands in front of
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          bash .github/scripts/refuse-a-negated-closing-keyword.sh             "$RUNNER_TEMP"/pull-request-text/*

      - name: Warn about a version bump that moves no release-note fragment
        # WARN tier (#326), so this annotates and never reds for the convention.
        # It does red when it could not judge - handed no change to read, it
        # fails closed rather than reporting a clean run over nothing.
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          bash .github/scripts/warn-on-a-version-bump-that-moves-no-fragment.sh "$RUNNER_TEMP/pull-request-change"

      - name: Prove that the version-bump warning fires, and stays at its tier
        # The step above is at WARN, so it exits 0 whatever it finds. A version
        # of it that had stopped matching would go green in exactly the same way,
        # and would keep doing so until the first release - the one run where
        # finding out costs something. So the warning is watched firing on the
        # change that landed here, the near misses are watched staying quiet, and
        # the tier itself is asserted rather than described.
        if: ${{ !cancelled() }}
        run: bash .github/scripts/prove-the-version-bump-warning-bites.sh

      - name: Prove that refusal bites, on the text that got past every check before it
        # The step above going green means this body and these messages are
        # clean. It says nothing about whether the shape would have been caught,
        # and a pattern that silently stopped matching goes green in exactly the
        # same way. So the refusal is watched biting on the bytes of the landed
        # instances, and the correct closing lines beside them are watched going
        # through.
        if: ${{ !cancelled() }}
        run: bash .github/scripts/prove-the-negated-closing-keyword-refusal-bites.sh
