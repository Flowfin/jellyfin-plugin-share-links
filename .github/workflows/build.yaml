name: "🏗️ Build Plugin"

on:
  push:
    branches:
      - master
    paths-ignore:
      - "**/*.md"
  # No paths filter on this trigger. The `gate` ruleset requires the context this
  # workflow produces, `call / build`, and a required context that declines to run
  # is recorded as missing rather than as passed, which blocks the merge with no
  # rerun that clears it. A documentation change therefore pays for a build.
  pull_request:
    branches:
      - master
  workflow_dispatch:

# Read-only: the called workflow restores and builds, it publishes nothing.
permissions:
  contents: read

jobs:
  call:
    # Kept alongside the first-party build in ci.yaml because the `gate` ruleset
    # requires the context this job produces, `call / build`, and a ruleset is not
    # edited from a pull request. Pinned by commit so what a required check runs
    # cannot change in another repository without a change here.
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/build.yaml@eb99033a7ff644881b014bc0b4169916c854a68b # master as of 2026-07-29
    with:
      # The shared workflow installs one SDK and defaults to 9.0.x. This tree now
      # compiles two server lines and the 12.0 packages support net10.0 only, so a
      # restore under a 9.0-only SDK fails on the second line and this required
      # context reds for a reason that is nothing to do with the change (#181).
      #
      # `dotnet-target` is left at its default of net9.0 on purpose. What this job
      # builds a package from is the line build.yaml names, and that stays the 10.11
      # line until 12.0.0 is released, per the decision of 2026-08-21 on #181.
      dotnet-version: |
        9.0.x
        10.0.x
