# An alert when a publish run does not succeed (#91).
#
# A release that fails is a release that is silently missing. Nothing else in
# this repository watches `publish.yaml`: the run reds in the Actions tab, an
# email goes to whoever pushed the tag, and the catalogue simply does not gain a
# version. What an operator notices is the absence, days later, and that is the
# failure this file exists against.
#
# The alert is an issue on this board. That is what "somewhere a person sees
# without going to look" means here: nothing else is wired to this repository,
# and a notification reaching one account is not a place a decision gets taken.
# An issue is read by whoever opens the board next, carries the run and the step
# in its body, and stays until somebody closes it.
#
# WHAT THIS HAS NOT BEEN SEEN TO DO. It has never fired. No tag has ever been
# pushed here and no publish run exists, so what is below is a design and not an
# observation. The clause of #91 asking that the alert be seen to fire against a
# publish run deliberately made to fail is NOT met by this file, and that clause
# needs a tag spent on it.
#
# The trigger is `workflow_run` rather than a step inside `publish.yaml`. A step
# there has to run after the failure it reports, which means `if: failure()` on
# every job or a reporting job depending on all of them, and both go missing at
# exactly the moment the run dies for a reason the workflow did not anticipate: a
# cancelled run, a job that never starts, a runner that disappears. This reads
# the completed run from outside, so nothing inside the publish has to remember
# it.
#
# It also never runs with the publish's own permissions. `workflow_run` starts a
# separate run against the default branch with the token this file asks for, so a
# compromised publish cannot reach `issues: write` through it, and this file
# holds no `contents: write` at all.

name: Publish Failure Alert

on:
  workflow_run:
    workflows: ["Publish Release"]
    types: [completed]

# Explicit deny-all at workflow level; the job below grants only what it reads
# and the one thing it writes.
permissions: {}

# One alert per publish run. Keyed on the run rather than on the workflow,
# because two tags pushed together are two runs and two failures and a shared
# group would drop one of them. Never cancelled: an alert killed halfway is the
# silence this file is written against.
concurrency:
  group: publish-failure-alert-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  alert:
    name: Alert on a publish that did not succeed
    # Anything other than success, rather than failure alone. A cancelled run and
    # a timed-out run both leave the release missing, and `failure()` lets them
    # past in silence.
    if: github.event.workflow_run.conclusion != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read # the failing run's jobs and their steps
      issues: write # where the alert is left

    steps:
      # No checkout. Every input is read from the event payload and the API, so
      # there is no working tree here to guard, and no untrusted value is
      # interpolated into a shell `run:`.
      - name: Open an issue naming the run and the step that failed
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const run = context.payload.workflow_run;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // `publish.yaml` triggers on a tag push only, so the run's
            // head_branch is the tag name rather than a branch.
            const tag = run.head_branch || "(the run carried no ref)";
            const marker = "<!-- publish-failure-alert run:" + run.id + " -->";

            // An alert already written for this run is not written again. A
            // re-run of the same publish is a new run id and gets its own
            // alert, which is wanted: two failures are two things to look at.
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "all",
              per_page: 100,
            });
            if (existing.some((i) => (i.body || "").includes(marker))) {
              core.info("An alert for run " + run.id + " is already on this board.");
              return;
            }

            const jobs = await github.paginate(
              github.rest.actions.listJobsForWorkflowRun,
              { owner, repo, run_id: run.id, per_page: 100 },
            );

            const endedBadly = (conclusion) =>
              conclusion !== null &&
              conclusion !== undefined &&
              conclusion !== "success" &&
              conclusion !== "skipped" &&
              conclusion !== "neutral";

            const lines = [];
            for (const job of jobs.filter((j) => endedBadly(j.conclusion))) {
              const steps = (job.steps || []).filter((s) => endedBadly(s.conclusion));
              if (steps.length === 0) {
                // A job that ended badly with no step to blame. Said plainly
                // rather than left out: a cancelled job and a job whose runner
                // vanished both look like this, and reporting nothing for them
                // would be the alert covering less than it appears to.
                lines.push(
                  "- `" +
                    job.name +
                    "` ended `" +
                    job.conclusion +
                    "` and names no failing step. " +
                    job.html_url,
                );
                continue;
              }
              for (const step of steps) {
                lines.push(
                  "- `" +
                    job.name +
                    "` / `" +
                    step.name +
                    "` ended `" +
                    step.conclusion +
                    "`. " +
                    job.html_url,
                );
              }
            }
            if (lines.length === 0) {
              lines.push(
                "- No job on this run ended badly. The run itself concluded `" +
                  run.conclusion +
                  "`, which is what a run cancelled or refused before any job " +
                  "started looks like.",
              );
            }

            const body = [
              marker,
              "",
              "The publish run for `" +
                tag +
                "` concluded `" +
                run.conclusion +
                "`, so no release was published for that tag and nothing else " +
                "in this repository would have said so.",
              "",
              "## The run",
              "",
              run.html_url,
              "",
              "## What ended badly",
              "",
              ...lines,
              "",
              "## What this did not check",
              "",
              "Whether a release exists for the tag. This reads the jobs and " +
                "steps of the run and nothing else, so a run that failed after " +
                "creating something is reported the same way as one that failed " +
                "before. `docs/RELEASING.md` is where the state of a tag is read.",
              "",
              "Opened by `.github/workflows/publish-failure-alert.yml`.",
            ].join("\n");

            // The milestone is looked up by title rather than written as a
            // number, because a number here goes wrong silently when the
            // milestones are renumbered. Where it is not found the alert is
            // still opened without one: an alert nobody sees is worse than an
            // issue missing a field, and the absence is warned about in the log.
            let milestone;
            const milestones = await github.paginate(
              github.rest.issues.listMilestones,
              { owner, repo, state: "open", per_page: 100 },
            );
            const wanted = milestones.find((m) =>
              m.title.startsWith("M11 Release and catalogue readiness"),
            );
            if (wanted) {
              milestone = wanted.number;
            } else {
              core.warning(
                "No open milestone titled M11 Release and catalogue readiness, " +
                  "so the alert carries none.",
              );
            }

            const created = await github.rest.issues.create({
              owner,
              repo,
              title: "Publish did not succeed for " + tag,
              body,
              labels: ["ci"],
              assignees: ["iderex"],
              ...(milestone === undefined ? {} : { milestone }),
            });
            core.notice(
              "Alert opened as #" + created.data.number + " for run " + run.id + ".",
            );
