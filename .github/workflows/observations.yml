# The observations that need a real server (#237).
#
# Three done-when clauses on this board say a claim has to be seen on a running
# Jellyfin rather than against a double, and they were routed to a hand-run
# session on the assumption that no server was available to run them against.
# `Flowfin/jellyfin-plugin-sso` has been disproving that assumption nightly, and
# this board already runs `docker run` in `headless.yml`, so what is new here is
# bringing a server up rather than a build container.
#
# What this job proves that the suite cannot. The suite drives the decision: it
# hands `ShareResolution` a clock and a list of records, and it hands the
# confinement filter a fabricated authorization context. Whether the server
# applies that filter at all is the server's own pipeline ordering, which is not
# in the packages this plugin compiles against, and whether the session ceiling
# the plugin writes onto an account is honoured is the server's own enforcement.
# Both are read here off a server that was handed the packaged plugin and nothing
# else.
#
# On a schedule and on a pull request that touches the harness, in the shape the
# sibling board settled on: the per-day evidence is what makes a green run mean
# something, and paying a container start on every push to the tree would buy a
# second copy of a run the pull request already made.
#
# TWO BOOTS SINCE #96, not one. The family rule is that this plugin works alone
# and works with every other supported sibling installed at the same time, and
# one boot can only ever answer the first half. The second boot installs what the
# Flowfin catalogue serves beside this plugin, runs the same observations again,
# and compares the two servers on the three axes that rule is about: routes,
# scheduled task names, and configuration. What the set is, is read from the
# catalogue at the moment it is used rather than listed here, so the run widens on
# the day a sibling board publishes its first release.
name: observations

on:
  schedule:
    - cron: "23 2 * * *"
  pull_request:
    paths:
      - ".github/workflows/observations.yml"
      - ".github/scripts/observe-on-a-real-server.sh"
      - ".github/scripts/install-the-supported-set.sh"
      - ".github/scripts/read-the-server-surface.sh"
      - ".github/scripts/refuse-a-collision.sh"
      - ".github/scripts/prove-the-collision-scan-bites.sh"
      - ".github/scripts/refuse-a-startup-error.sh"
      - ".github/scripts/prove-the-startup-refusal-bites.sh"
      - ".github/browser/**"
  workflow_dispatch:

# Deny-all at the workflow level; the job below reads the tree to build the
# package and needs nothing else.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Two SDKs, because the tree carries two server lines and the 12.0 packages
  # support net10.0 only (#181). Pinned rather than a wildcard, for the reason the
  # first line already gives: the SDK that judges a pull request is the SDK the next
  # one is judged by.
  DOTNET_VERSION: |
    9.0.316
    10.0.301
  PYTHON_VERSION: "3.12"
  # The same runtime the formatting job pins, for the same reason: the browser is
  # what is being pinned and a runtime moving under it is the other half of the
  # same reproducibility.
  NODE_VERSION: "24.18.0"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  # The server line `Directory.Build.props` compiles against, pinned by digest
  # rather than by tag: what makes an observation on one day has to be what makes
  # it on the next, and a tag is a name somebody else can repoint.
  #
  #   curl -s "https://hub.docker.com/v2/repositories/jellyfin/jellyfin/tags/10.11.11" | jq -r .digest
  JELLYFIN_IMAGE: "jellyfin/jellyfin:10.11.11@sha256:aefb67e6a7ff1debdd154a78a7bbb780fd0c873d8639210a7f6a2016ad2b35db"
  # Where the supported set is read from. This is the catalogue an operator adds
  # to their server, so what the second boot installs is what an operator would
  # have installed, and not a list somebody kept up to date by hand. This board
  # publishes nothing yet and is therefore absent from it; the installer skips its
  # own entry by guid anyway, so the day that changes the subject still comes from
  # the package this job builds out of the tree.
  CATALOGUE: "https://flowfin.dev/manifest.json"

jobs:
  observe:
    name: Observations on a real Jellyfin
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prove the collision scan refuses a collision
        # First, because it reaches no server and costs seconds. The comparison
        # further down runs against two boots that did not collide, which is what
        # a green run means and is also what a scan that never fires looks like,
        # so every refusal is shown to bite on its own fault against a surface
        # written to carry exactly one.
        run: bash .github/scripts/prove-the-collision-scan-bites.sh

      - name: Prove the startup rule refuses a startup error
        # Same reason, and the near misses matter more here than the
        # refusals do: the subject is a third party's log, so a rule drawn
        # one line too wide reds this board's nightly for a line another
        # project wrote.
        run: bash .github/scripts/prove-the-startup-refusal-bites.sh

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install the pinned browser
        # `npm ci` and not `npm install`, so what drives the browser leg is the
        # version `.github/browser/package-lock.json` records rather than
        # whatever the registry offers today. `playwright install` then fetches
        # the browser build that package version is tied to, so the two move
        # together or not at all.
        #
        # `--with-deps` is what pulls the shared libraries Chromium needs on a
        # bare runner. It is an apt install on the runner and nothing else, and
        # it reaches no part of this repository.
        run: |
          set -euo pipefail
          npm --prefix .github/browser ci
          npx --prefix .github/browser playwright install --with-deps chromium

      - name: Install JPRM
        # The same pinned set `package.yaml` installs, and for the same reason.
        # The observation is worth making against the archive an operator
        # installs rather than against a build directory, because what a server
        # loads is a directory of files somebody unpacked.
        run: |
          set -euo pipefail
          pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r .github/jprm-requirements.txt

      - name: Build the plugin package
        run: |
          set -euo pipefail
          mkdir -p ./artifacts
          jprm --verbosity=debug plugin build . --output ./artifacts
          ls -l ./artifacts

      - name: Install the package where the server reads its plugins
        # Unpacked into a bind mount rather than installed through the
        # catalogue, because the catalogue is a network route this job does not
        # need and the bytes are the same either way. World-writable so the
        # container's own user can write the plugin's configuration back.
        run: |
          set -euo pipefail
          plugin_dir="test/e2e/jellyfin/config/plugins/ShareLinks"
          mkdir -p "$plugin_dir" test/e2e/jellyfin/cache test/e2e/media/movies
          unzip -o ./artifacts/*.zip -d "$plugin_dir"
          ls -la "$plugin_dir"
          chmod -R 0777 test/e2e

      - name: Generate the items the observations are made against
        # Generated rather than committed: a video in the tree is bytes nobody
        # reviews, and these only have to exist and carry a bitrate above the cap
        # the share is given.
        #
        # Two of them. One is what the share names and the other is what the guest
        # must not reach, and a library holding only the shared item cannot tell a
        # confinement that works from one that was never asked a question.
        #
        # With the server image's own ffmpeg rather than the runner's, which is
        # not there: `ffmpeg: command not found` on the first run of this job.
        # Installing one would add a package to the runner and a second version
        # of the tool to reason about, and the image this job already pins ships
        # the build the server itself would transcode with.
        run: |
          set -euo pipefail
          for name in "An Observation (2026)" "Another Observation (2026)"; do
            mkdir -p "test/e2e/media/movies/$name"
            docker run --rm --user 0:0 \
              -v "$PWD/test/e2e/media:/out" \
              --entrypoint /usr/lib/jellyfin-ffmpeg/ffmpeg \
              "$JELLYFIN_IMAGE" \
              -hide_banner -loglevel error -y \
              -f lavfi -i "testsrc=size=640x480:rate=25" \
              -t 6 -c:v libx264 -preset ultrafast -b:v 3000k -pix_fmt yuv420p \
              "/out/movies/$name/$name.mkv"
          done
          sudo chmod -R 0777 test/e2e/media
          ls -laR test/e2e/media/movies

      - name: Start the server
        run: |
          set -euo pipefail
          docker run -d --name jellyfin \
            -p 127.0.0.1:8096:8096 \
            -v "$PWD/test/e2e/jellyfin/config:/config" \
            -v "$PWD/test/e2e/jellyfin/cache:/cache" \
            -v "$PWD/test/e2e/media:/media:ro" \
            -e JELLYFIN_LOG_DIR=/config/log \
            "$JELLYFIN_IMAGE"
          docker ps

      - name: Make the observations
        run: bash .github/scripts/observe-on-a-real-server.sh http://127.0.0.1:8096

      - name: Record the surface this plugin puts on a server alone
        # The first half of the comparison #96 asks for. It is judged on its own
        # here as well as against the second boot, because a duplicate task name
        # or a plugin the server would not run is a fault whether or not anything
        # else is installed, and a comparison is not the place to find one.
        run: |
          set -euo pipefail
          bash .github/scripts/read-the-server-surface.sh http://127.0.0.1:8096 /tmp/surface-alone.json
          bash .github/scripts/refuse-a-collision.sh /tmp/surface-alone.json

      - name: What the server said, with this plugin alone
        # Always, because a failed observation is read out of the server's log
        # and not out of the step that failed.
        #
        # THIS SAID A GREEN RUN IS WHERE THE PLUGIN'S OWN LOG LINES ARE CHECKED BY
        # EYE FOR THE FIRST TIME, AND THAT IS NOW ONLY THE REMAINDER. The step
        # below refuses a fatal and an error out of this plugin. Everything else
        # the server writes is still read by a person or not at all, and that is
        # deliberate: the rest of this log belongs to a third party and to other
        # plugins.
        if: always()
        run: |
          set -euo pipefail
          docker logs jellyfin 2>&1 | tail -300 || true
          echo "===== what the plugin wrote ====="
          docker logs jellyfin 2>&1 | grep -i "sharelinks\|share links" | tail -100 || true

      - name: Refuse a startup error on the boot with this plugin alone
        run: |
          set -euo pipefail
          docker logs jellyfin >/tmp/log-alone.txt 2>&1
          bash .github/scripts/refuse-a-startup-error.sh /tmp/log-alone.txt "with this plugin alone"

      - name: Stop the server this plugin ran alone on
        # Removed rather than left running: the second server takes the same port
        # so that the observations are made against the same address twice, and
        # two servers behind one address would make it unreadable which of them
        # answered.
        run: docker rm -f jellyfin

      - name: Install this plugin and the supported set where the second server reads them
        # A second configuration directory rather than the first one reused. The
        # first server walked its startup wizard, and a run that started from that
        # state would be a server with a history rather than the clean one the
        # observations assume.
        run: |
          set -euo pipefail
          plugin_dir="test/e2e/with-the-set/config/plugins/ShareLinks"
          mkdir -p "$plugin_dir" test/e2e/with-the-set/cache
          unzip -o ./artifacts/*.zip -d "$plugin_dir"

          # The server line the set is installed for, taken out of the image this
          # job pins rather than written a second time. A sibling that publishes
          # for two lines at once publishes two releases, and asking for its
          # newest would put a build for the next line on this one.
          ref="${JELLYFIN_IMAGE%%@*}"
          line="${ref##*:}"
          echo "installing the supported set for server line $line"
          bash .github/scripts/install-the-supported-set.sh "$CATALOGUE" test/e2e/with-the-set/config/plugins "$line"

          chmod -R 0777 test/e2e/with-the-set

      - name: Start the second server, with the supported set installed
        run: |
          set -euo pipefail
          docker run -d --name jellyfin-with-the-set \
            -p 127.0.0.1:8096:8096 \
            -v "$PWD/test/e2e/with-the-set/config:/config" \
            -v "$PWD/test/e2e/with-the-set/cache:/cache" \
            -v "$PWD/test/e2e/media:/media:ro" \
            -e JELLYFIN_LOG_DIR=/config/log \
            "$JELLYFIN_IMAGE"
          docker ps

      - name: Make the observations again, with the set installed
        # The same script, unchanged. Everything this plugin does is driven end to
        # end a second time with the siblings present, which is the half of the
        # rule a surface comparison cannot reach: two plugins declaring the SAME
        # route are one entry in the server's own description of itself, and what
        # finds that is a call that no longer answers.
        run: bash .github/scripts/observe-on-a-real-server.sh http://127.0.0.1:8096

      - name: Refuse a collision between this plugin and the supported set
        run: |
          set -euo pipefail
          bash .github/scripts/read-the-server-surface.sh http://127.0.0.1:8096 /tmp/surface-with-the-set.json
          bash .github/scripts/refuse-a-collision.sh /tmp/surface-with-the-set.json /tmp/surface-alone.json

      - name: Refuse a startup error on the boot with the set installed
        run: |
          set -euo pipefail
          docker logs jellyfin-with-the-set >/tmp/log-with-the-set.txt 2>&1
          bash .github/scripts/refuse-a-startup-error.sh /tmp/log-with-the-set.txt "with the supported set installed"

      - name: What the second server said
        if: always()
        run: |
          set -euo pipefail
          docker logs jellyfin-with-the-set 2>&1 | tail -300 || true
          echo "===== what the plugin wrote ====="
          docker logs jellyfin-with-the-set 2>&1 | grep -i "sharelinks\|share links" | tail -100 || true

      - name: Stop the servers
        if: always()
        run: |
          docker rm -f jellyfin || true
          docker rm -f jellyfin-with-the-set || true
