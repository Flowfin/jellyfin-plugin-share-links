# The version a release carries, and the only place it is written. The tag gate in
# .github/workflows/publish.yaml refuses a tag whose numeric part is not this
# value, and Directory.Build.props reads this field for AssemblyVersion,
# FileVersion and Version, so the number in the catalogue entry and the number
# inside the DLL cannot be different numbers. docs/versioning.md carries what that
# gave up: 0.0.0.0 used to be reserved for a build the release process did not
# make, and no number does that job any more.
version: "0.1.0.0"
# The oldest server line this plugin claims to load on. Directory.Build.props
# compiles against a newer 10.11.x, and the abi-floor job builds against this
# number as well, so every API the plugin calls is proven to exist here too.
targetAbi: "10.11.9.0"
framework: "net9.0"
owner: "Flowfin"
# The sentence a user reads in the catalogue list before opening anything. It
# names the one feature and says who a share is for, because the difference
# between an invited guest and an anonymous public link is the whole posture and
# nobody should have to install the plugin to find it out.
overview: "Share a single library item with invited guests of your server, through a link that expires and can be revoked."
description: >
  Share Links does one thing: an operator picks one item out of the library and
  gets a link to it for a guest they have invited.

  Sharing is designed for invited guests of the server operator. There are no
  anonymous public links. A guest signs in to the server, and the share reaches
  only the one item it names. A share expires, and an operator can revoke it
  before it does.

  Shares are created, listed and revoked from the plugin's page in the server
  dashboard. Nothing is added to the web client and no mail is sent, so the
  operator passes the link to the guest themselves.
# The operator is the only person who opens this plugin's page, and what they do
# there is administer access to the library. Administration is one of the
# categories the published catalogue actually carries:
#   curl -sSL https://repo.jellyfin.org/files/plugin/manifest.json \
#     | grep -o '"category": *"[^"]*"' | sort -u
category: "Administration"
artifacts:
  - "Jellyfin.Plugin.ShareLinks.dll"
# What a catalogue shows under a version's changelog. The packaging tool copies
# this one string into the meta.json of every package it builds, so it cannot
# describe a particular release without being wrong about the next one; it names
# where the notes are instead. The notes themselves are assembled from
# changelog.d into the GitHub release the tag creates, which docs/RELEASING.md
# describes. What may not stand here is a claim about the release history: this
# file ships inside every package, so a sentence about what has or has not been
# published is written before the release it travels in and refuted by it.
# PackagingMetadataTests refuses that class.
changelog: >
  The notes for each release are in the GitHub release for its tag, at
  https://github.com/Flowfin/jellyfin-plugin-share-links/releases.
